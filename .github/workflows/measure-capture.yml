name: measure-capture

# Manual measurement, not a gate: renders the gallery headless (no display, pinned
# locale and time zone) on Linux and macOS and uploads both captures so they can be
# compared before any screenshot baseline is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  STAPEL_MEASURE_CAPTURE: '1'

jobs:
  capture:
    name: capture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Android platform 37
        if: runner.os == 'Linux'
        run: |
          ls "$ANDROID_HOME/platforms" | grep -q '^android-37' || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - run: ./gradlew -Dorg.gradle.jvmargs=-Xmx3g :showcase:gallery:jvmTest --tests '*ScreenshotMeasurementTest*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: captures-${{ matrix.os }}
          path: showcase/gallery/build/captures
          retention-days: 14
