name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push supersedes its older run. A push to main never does:
# each commit gets its own group, because GitHub keeps only one pending run per
# group and silently cancels the previous pending one even without
# cancel-in-progress. Rule tested by build-logic CiWorkflowTest.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # The macOS runner has 7 GB; gradle.properties asks for 6 GB.
  MAC_HEAP: -Dorg.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC

jobs:
  build-logic:
    name: build-logic (TestKit inversion tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew -p build-logic check -Pstapel.testkitHome=$HOME/.gradle/stapel-testkit

  fast:
    name: fast (jvm + android host + gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Android platform 37
        run: |
          ls "$ANDROID_HOME/platforms" | grep -q '^android-37' || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      # Compose desktop UI tests run under a virtual display until pure headless is proven on Linux.
      - run: xvfb-run -a ./gradlew stapelCheckFast --continue

  ios:
    name: ios (simulator tests + the iOS floor on test executables)
    runs-on: macos-26
    # macOS runners are the bottleneck: a newer commit's job supersedes this job while it is still
    # QUEUED (GitHub keeps one pending job per group); a running job is never cancelled. ci-ok reports
    # a superseded commit as superseded, never as green. Rule tested by build-logic CiWorkflowTest.
    concurrency:
      group: macos-ios-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: xcodebuild -version
      # Dokka and the screenshot baselines run in the parallel `docs` job: one Gradle invocation of
      # both on a 3-core runner passed 45 minutes once the profiles brick landed (3e64033).
      - run: ./gradlew "$MAC_HEAP" iosSimulatorArm64Test --continue
      # The iOS floor on what was linked: no test executable's code targets an iOS above IOS_FLOOR.
      - run: ./gradlew "$MAC_HEAP" checkIosBinaries

  docs:
    name: docs (Dokka gate + screenshot baselines)
    runs-on: macos-26
    # macOS runners are the bottleneck: a newer commit's job supersedes this job while it is still
    # QUEUED (GitHub keeps one pending job per group); a running job is never cancelled. ci-ok reports
    # a superseded commit as superseded, never as green. Rule tested by build-logic CiWorkflowTest.
    concurrency:
      group: macos-docs-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: xcodebuild -version
      - run: ./gradlew "$MAC_HEAP" dokkaGeneratePublicationHtml --continue
      # Screenshot baselines are recorded and verified on macOS only (Linux text rasterisation differs).
      - run: ./gradlew "$MAC_HEAP" :showcase:gallery:verifyScreenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshot-report-${{ github.sha }}
          path: showcase/gallery/build/showcase/screenshot-report
          retention-days: 14

  publish-smoke:
    name: publish-smoke (staging repo + consumer by coordinates)
    runs-on: macos-26
    # macOS runners are the bottleneck: a newer commit's job supersedes this job while it is still
    # QUEUED (GitHub keeps one pending job per group); a running job is never cancelled. ci-ok reports
    # a superseded commit as superseded, never as green. Rule tested by build-logic CiWorkflowTest.
    concurrency:
      group: macos-publish-smoke-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew "$MAC_HEAP" publishAllPublicationsToStagingRepository
      - run: scripts/verify-artifacts.sh
      # The iOS floor on what is published: no klib carries a newer version-min option or native object.
      - run: ./gradlew "$MAC_HEAP" checkIosBinaries
      - run: ./gradlew "$MAC_HEAP" -p consumer-smoke check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stapel-kmp-repo-${{ github.sha }}
          path: build/staging-repo
          retention-days: 14

  sample:
    name: sample (shop-mobile built from the staging repo, every target)
    needs: [publish-smoke]
    runs-on: macos-26
    # macOS runners are the bottleneck: a newer commit's job supersedes this job while it is still
    # QUEUED (GitHub keeps one pending job per group); a running job is never cancelled. ci-ok reports
    # a superseded commit as superseded, never as green. Rule tested by build-logic CiWorkflowTest.
    concurrency:
      group: macos-sample-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stapel-kmp-repo-${{ github.sha }}
          path: build/staging-repo
      - name: The sample builds against this train
        run: |
          train="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          sample="$(sed -n 's/^stapel.version=//p' samples/shop-mobile/gradle.properties)"
          [ "$train" = "$sample" ] || { echo "samples/shop-mobile stapel.version=$sample, train $train"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Auth stand up (stapel-tools scaffold, prototype posture, 127.0.0.1:18731)
        env:
          K7_PYTHON: python3.12
        run: bricks/auth/e2e/stand/stand.sh up
      - name: Profiles stand up (stapel-tools scaffold with auth + profiles + cdn, prototype posture, 127.0.0.1:18761)
        env:
          K15_PYTHON: python3.12
        run: bricks/profiles/e2e/stand/stand.sh up
      - name: Gates, builds and the sign-in and profiles walks on jvm + iOS simulator against the stands
        working-directory: samples/shop-mobile
        run: >
          ./gradlew :shared:stapelGenerateCheck :shared:checkStapelTokens :shared:jvmTest
          :shared:iosSimulatorArm64Test :desktopApp:jar :androidApp:assembleDebug
          :shared:linkDebugFrameworkIosSimulatorArm64 -Pstapel.walk.baseUrl=http://127.0.0.1:18731/
          -Pstapel.walk.profilesBaseUrl=http://127.0.0.1:18761/
      - name: iOS app (xcodebuild), launch, deep link and the XCUITest suite on a simulator
        env:
          SHOP_STAND_URL: http://127.0.0.1:18731/
        run: samples/shop-mobile/scripts/ios-smoke.sh --uitest
      - name: iOS push walk (simctl push in the background, the banner tapped, the deep-linked order)
        env:
          SHOP_STAND_URL: http://127.0.0.1:18731/
        run: samples/shop-mobile/scripts/ios-smoke.sh --push
      - name: The iOS floor on the built app and the Kotlin framework it embeds
        run: >
          ./gradlew "$MAC_HEAP" checkIosBinaries
          -Pstapel.ios.binaries=samples/shop-mobile/shared/build/xcode-frameworks,samples/shop-mobile/build/ios-smoke/derived/Build/Products/Debug-iphonesimulator/ShopMobile.app
      - name: Consent gate in the built Android app (Firebase provider, fake config) and the release refusal without config
        working-directory: samples/shop-mobile
        run: |
          mkdir -p build
          if ./gradlew :androidApp:assembleRelease -Pshop.firebase=true > build/firebase-release-refusal.log 2>&1; then
            echo "a release build without androidApp/google-services.json was not refused"; exit 1
          fi
          grep -q "a release build without androidApp/google-services.json" build/firebase-release-refusal.log
          cp androidApp/fixtures/google-services.json androidApp/google-services.json
          ./gradlew :androidApp:assembleDebug -Pshop.firebase=true
          scripts/check-consent-manifest.sh
      - name: Auth and profiles stands down
        if: always()
        run: |
          bricks/auth/e2e/stand/stand.sh down
          bricks/profiles/e2e/stand/stand.sh down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shop-mobile-ios-smoke-${{ github.sha }}
          path: |
            samples/shop-mobile/build/ios-smoke/*.png
            samples/shop-mobile/build/ios-smoke/*.log
            samples/shop-mobile/build/ios-smoke/*.txt
            samples/shop-mobile/build/ios-smoke/uitest.xcresult
            samples/shop-mobile/build/ios-smoke/push.xcresult
            bricks/auth/e2e/build/stand/*.log
            bricks/profiles/e2e/build/stand/*.log
          retention-days: 14

  # The iOS floor (15.0) executed: the same app, walk and XCUITest suite on the OLDEST iOS simulator
  # runtime a supported GitHub-hosted runner has (macos-15: iOS 18.5, with Xcode 26.3; the macos-14 image
  # with iOS 17 is refused as "not supported"). No hosted image and no current Xcode can install an iOS 15
  # or 16 simulator runtime; what this job proves is "built for 15.0, runs on the oldest runtime
  # available", see docs/gates.md.
  sample-oldest-ios:
    name: sample-oldest-ios (shop-mobile on the oldest hosted iOS runtime)
    needs: [publish-smoke]
    runs-on: macos-15
    # macOS runners are the bottleneck: a newer commit's job supersedes this job while it is still
    # QUEUED (GitHub keeps one pending job per group); a running job is never cancelled. ci-ok reports
    # a superseded commit as superseded, never as green. Rule tested by build-logic CiWorkflowTest.
    concurrency:
      group: macos-sample-oldest-ios-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_SMOKE_RUNTIME: oldest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stapel-kmp-repo-${{ github.sha }}
          path: build/staging-repo
      - name: The oldest iOS runtime and an iPhone on it
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json,re,sys
          d=json.load(sys.stdin)["devices"]
          ver=lambda rt: [int(x) for x in re.findall(r"\d+", rt.rsplit("iOS", 1)[-1])]
          for rt in sorted((r for r in d if ".iOS-" in r), key=ver):
              for x in d[rt]:
                  if x["name"].startswith("iPhone"): print(x["udid"]); sys.exit()')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Auth stand up (stapel-tools scaffold, prototype posture, 127.0.0.1:18731)
        env:
          K7_PYTHON: python3.12
        run: bricks/auth/e2e/stand/stand.sh up
      - name: The sign-in walk on the oldest iOS simulator against the stand
        working-directory: samples/shop-mobile
        run: >
          ./gradlew :shared:iosSimulatorArm64Test -Pstapel.walk.baseUrl=http://127.0.0.1:18731/
          -Pstapel.ios.simulator=${{ steps.sim.outputs.udid }}
      - name: iOS app (xcodebuild), launch, deep link and the XCUITest suite on the oldest runtime
        env:
          SHOP_STAND_URL: http://127.0.0.1:18731/
        run: samples/shop-mobile/scripts/ios-smoke.sh --uitest ${{ steps.sim.outputs.udid }}
      - name: Auth stand down
        if: always()
        run: bricks/auth/e2e/stand/stand.sh down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shop-mobile-oldest-ios-${{ github.sha }}
          path: |
            samples/shop-mobile/build/ios-smoke/*.png
            samples/shop-mobile/build/ios-smoke/*.log
            samples/shop-mobile/build/ios-smoke/*.txt
            samples/shop-mobile/build/ios-smoke/uitest.xcresult
            bricks/auth/e2e/build/stand/*.log
          retention-days: 14

  ios-bridges:
    name: ios-bridges (Swift bridges compiled against the pinned vendor packages)
    needs: [publish-smoke]
    runs-on: macos-26
    # macOS runners are the bottleneck: a newer commit's job supersedes this job while it is still
    # QUEUED (GitHub keeps one pending job per group); a running job is never cancelled. ci-ok reports
    # a superseded commit as superseded, never as green. Rule tested by build-logic CiWorkflowTest.
    concurrency:
      group: macos-ios-bridges-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stapel-kmp-repo-${{ github.sha }}
          path: build/staging-repo
      - name: The Kotlin framework Shared exporting the bridge protocols, from the staging repo
        run: ./gradlew "$MAC_HEAP" -p ios-bridges/check :shared:assembleSharedReleaseXCFramework
      - name: Every bridge compiles against its vendor's Swift package at the pinned exact version
        working-directory: ios-bridges
        run: >
          xcodebuild -scheme StapelBridges -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/derived build

  # The ONE required check for branch protection. Green only when every job succeeded; a commit whose
  # macOS job was superseded while queued is reported SUPERSEDED (red, never green); anything else red
  # is FAILED. Verdict rules: scripts/ci-verdict.sh, tested by build-logic CiWorkflowTest.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build-logic, fast, ios, docs, publish-smoke, sample, sample-oldest-ios, ios-bridges]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          THIS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs')"
          if [ -n "$PR_NUMBER" ]; then
            LATEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          else
            LATEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          fi
          export JOBS LATEST_SHA
          scripts/ci-verdict.sh | tee -a "$GITHUB_STEP_SUMMARY"
