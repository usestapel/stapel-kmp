# One version for every published module (one release train, see docs/release.md).
VERSION_NAME=0.0.1

# Maven group: provisional, changeable until the first publish without touching
# a source file (ruling R2). Kotlin packages do NOT follow it: they are rooted
# at `stapel.<module>`.
stapel.group=io.github.usestapel
stapel.packageRoot=stapel

org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
