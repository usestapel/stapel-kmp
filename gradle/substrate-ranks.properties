# Rank of each substrate artifact. An edge between two substrate artifacts of the
# same kind (pure -> pure, ui -> ui) may only go from a higher rank to a lower one.
# Pure -> ui is always forbidden; ui -> pure is always allowed.
# Owned by the build; the edges come from ARCH-CORE/-CACHE/-NAV-SCAFFOLD/-UI-TOKENS
# (2026-11-19). A substrate module without a rank fails checkDependencyDirection.

# --- pure ---------------------------------------------------------------
stapel-result=0
stapel-di=0
stapel-tokens=0
stapel-i18n=0
stapel-image=0
stapel-runtime=1
stapel-config=1
stapel-wire=1
stapel-mvi=2
stapel-navigation=2
stapel-network=3
stapel-navigation-testing=3
stapel-cache=4
stapel-session=4
stapel-cache-room=5
stapel-cache-session=5
stapel-testing=6
stapel-cache-testing=6

# --- compose (substrate-ui) -----------------------------------------------
stapel-ui=10
stapel-mvi-compose=10
stapel-navigation-compose=10
stapel-ui-material3=11
stapel-ui-font-inter=11
stapel-image-compose=11
stapel-showcase=11
stapel-ui-testing=12
stapel-shell=12
stapel-shell-testing=13
