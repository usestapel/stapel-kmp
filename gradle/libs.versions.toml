# The one version catalog of stapel-kmp.
#
# Owned by the build (build-logic/ + this file). A module never declares a
# version of its own; a brigade that needs a library not listed here asks for
# a one-line catalog change instead of adding it.
#
# Rules (enforced by `./gradlew checkCatalog`):
#   - exact versions only: no ranges, no `+`, no SNAPSHOT;
#   - no pre-release (alpha/beta/rc/dev/eap/milestone) unless the version key
#     is listed in gradle/prerelease-allowlist.txt with a reason;
#   - a published POM never carries a pre-release coordinate
#     (`checkReleaseCoordinates`, part of the release path).
#
# Toolchain train (Kotlin, AGP, Gradle, Compose, KSP) moves together, only when
# the Kotlin multiplatform compatibility table lists the target AGP/Gradle.
# Every version below was resolved against Maven Central / Google Maven /
# the Gradle Plugin Portal on 2026-11-19; the build is the proof they resolve
# together.

[versions]
# --- toolchain train -------------------------------------------------------
kotlin = "2.4.21"
agp = "9.3.1"
compose-multiplatform = "1.12.2"
# Compose Multiplatform's Material 3 has its own line; 1.9.0 is what CMP 1.12.2 maps `material3` to.
compose-material3 = "1.9.0"
compose-material3-adaptive = "1.3.0"
compose-material-icons = "1.7.3"
ksp = "2.3.14"
android-compileSdk = "37"
android-minSdk = "24"
jvm-target = "17"

# --- kotlinx -------------------------------------------------------------
coroutines = "1.11.0"
serialization = "1.13.0"
datetime = "0.8.0"
kotlinx-io = "0.9.3"

# --- network / di / images -------------------------------------------------
ktor = "3.6.1"
okhttp = "5.5.1"
koin = "4.2.2"
coil = "3.6.3"

# --- JetBrains androidx ports (multiplatform) ------------------------------
jb-navigation3 = "1.2.0"

# --- androidx (Android-only or Google-published multiplatform) -------------
room3 = "3.0.3"
androidx-sqlite = "2.7.1"
# One line with Compose Multiplatform 1.12.2 (its .module requires lifecycle 2.11.0, savedstate 1.4.0,
# annotation 1.9.1, collection 1.5.0; navigationevent 1.1.1 through its JetBrains redirect) and
# Navigation 3 1.2.0 (lifecycle >= 2.10.0, savedstate 1.4.0). build-logic substitutes the JetBrains
# redirect artifacts by these (REDIRECT_SHIMS); checkLibraryLines fails on a JetBrains/androidx twin.
androidx-lifecycle = "2.11.0"
androidx-savedstate = "1.4.0"
androidx-navigationevent = "1.1.1"
androidx-navigation = "2.10.0"
androidx-annotation = "1.9.1"
androidx-collection = "1.5.0"
androidx-paging = "3.5.3"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-biometric = "1.1.0"
androidx-credentials = "1.6.0"
androidx-browser = "1.10.0"
androidx-work = "2.12.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
play-services-auth-api-phone = "18.3.1"
# Analytics vendor SDKs: Android only, inside the provider artifacts stapel-analytics-{firebase,appmetrica}.
# firebase-analytics 24.0.0 is what Firebase Android BoM 35.2.0 (2026-11-11) maps; minSdk 24.
# AppMetrica 8.6.0 (2026-09-30, Maven Central); its build constants say minSdk 21.
firebase-analytics = "24.0.0"
appmetrica-analytics = "8.6.0"
# Push vendor SDK: Android only, inside stapel-push-firebase. firebase-messaging 26.0.2 is what Firebase
# Android BoM 35.2.0 maps; minSdk 24.
firebase-messaging = "26.0.2"

# --- build tooling -----------------------------------------------------------
dokka = "2.3.0"
vanniktech-publish = "0.37.0"
kover = "0.9.11"
roborazzi = "1.79.0"
skie = "0.10.16"

# --- JVM tools (tools/*) -----------------------------------------------------
kotlinpoet = "2.4.0"
clikt = "5.2.1"
junit-jupiter = "6.1.3"

# --- test libraries ----------------------------------------------------------
turbine = "1.2.1"
robolectric = "4.18.1"
konsist = "0.18.1"

[libraries]
# --- build-logic classpath (Gradle plugins as libraries) ----------------------
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
vanniktech-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-publish" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room3-gradle-plugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }

# --- Kotlin ------------------------------------------------------------------
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

# --- kotlinx -------------------------------------------------------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

# --- Ktor (CORE: OkHttp on android+jvm, Darwin on iOS, no CIO client) ----------
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Test-only in-process server for the per-engine wire tests (cookie storage disabled, G-N3).
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

# --- Koin (koin-core only inside a library's `di` package; koin-compose only in UI) ---
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# --- Compose Multiplatform -----------------------------------------------------
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
